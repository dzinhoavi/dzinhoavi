name: Atualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"      # todo dia 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["today.py", "ascii-art.html"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py --art ascii-art.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: atualizar SVGs do perfil"
          git push
